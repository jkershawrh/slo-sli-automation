# Private dev template. Process parameters first; no Route, OAuth client, or cluster RBAC is created.
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: sloscope-private
parameters:
- name: SLOSCOPE_IMAGE
  required: true
  description: Reviewed registry/repository@sha256 digest; never use a moving tag.
- name: MODEL_SECRET
  value: sloscope-model
  required: true
- name: PROM_URL
  required: true
  description: Operator-controlled Prometheus endpoint; external endpoints require
    verified HTTPS.
- name: LOOKBACK
  value: 1h
- name: ARTIFACT_CLAIM
  value: sloscope-artifacts
objects:
- apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: ${ARTIFACT_CLAIM}
  spec:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 1Gi
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: sloscope
  spec:
    replicas: 1
    strategy:
      type: Recreate
    selector:
      matchLabels:
        app: sloscope
    template:
      metadata:
        labels:
          app: sloscope
      spec:
        automountServiceAccountToken: false
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        containers:
        - name: sloscope
          image: ${SLOSCOPE_IMAGE}
          ports:
          - containerPort: 8080
            name: http
          env:
          - name: PROM_URL
            value: ${PROM_URL}
          - name: SLOSCOPE_LOOKBACK
            value: ${LOOKBACK}
          - name: SLOSCOPE_STORE_DIR
            value: /artifacts
          - name: SLOSCOPE_SEED_DEMO
            value: 'false'
          - name: PYTHONDONTWRITEBYTECODE
            value: '1'
          - name: LLM_BASE_URL
            valueFrom:
              secretKeyRef:
                name: ${MODEL_SECRET}
                key: LLM_BASE_URL
          - name: LLM_API_KEY
            valueFrom:
              secretKeyRef:
                name: ${MODEL_SECRET}
                key: LLM_API_KEY
          - name: LLM_MODEL
            valueFrom:
              secretKeyRef:
                name: ${MODEL_SECRET}
                key: LLM_MODEL
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop:
              - ALL
          volumeMounts:
          - name: artifacts
            mountPath: /artifacts
          - name: tmp
            mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
        volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: ${ARTIFACT_CLAIM}
        - name: tmp
          emptyDir: {}
- apiVersion: v1
  kind: Service
  metadata:
    name: sloscope
  spec:
    selector:
      app: sloscope
    ports:
    - name: http
      port: 8080
      targetPort: http
    type: ClusterIP
- apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    name: sloscope-private
  spec:
    podSelector:
      matchLabels:
        app: sloscope
    policyTypes:
    - Ingress
    ingress:
    - from:
      - podSelector:
          matchLabels:
            app: sloscope
