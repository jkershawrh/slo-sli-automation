# Optional collector. Initially suspended; uses the existing artifact PVC and configured telemetry only.
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: sloscope-collector
parameters:
- name: SLOSCOPE_IMAGE
  required: true
  description: Reviewed registry/repository@sha256 digest; never use a moving tag.
- name: PROM_URL
  required: true
  description: Operator-controlled Prometheus endpoint; external endpoints require
    verified HTTPS.
- name: LOOKBACK
  value: 1h
- name: ARTIFACT_CLAIM
  value: sloscope-artifacts
- name: SERVICE
  required: true
- name: TARGET_NAMESPACE
  required: true
objects:
- apiVersion: batch/v1
  kind: CronJob
  metadata:
    name: sloscope-collector
  spec:
    schedule: '*/30 * * * *'
    suspend: true
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 2
    failedJobsHistoryLimit: 2
    jobTemplate:
      spec:
        backoffLimit: 0
        activeDeadlineSeconds: 180
        template:
          metadata:
            labels:
              app: sloscope
          spec:
            automountServiceAccountToken: false
            securityContext:
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            containers:
            - name: sloscope
              image: ${SLOSCOPE_IMAGE}
              env:
              - name: PROM_URL
                value: ${PROM_URL}
              - name: SLOSCOPE_LOOKBACK
                value: ${LOOKBACK}
              - name: SLOSCOPE_STORE_DIR
                value: /artifacts
              - name: SLOSCOPE_SEED_DEMO
                value: 'false'
              - name: PYTHONDONTWRITEBYTECODE
                value: '1'
              resources:
                requests:
                  cpu: 200m
                  memory: 256Mi
                limits:
                  cpu: '1'
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                  - ALL
              volumeMounts:
              - name: artifacts
                mountPath: /artifacts
              - name: tmp
                mountPath: /tmp
              command:
              - python
              - -m
              - backend.collector
              - --service
              - ${SERVICE}
              - --namespace
              - ${TARGET_NAMESPACE}
            volumes:
            - name: artifacts
              persistentVolumeClaim:
                claimName: ${ARTIFACT_CLAIM}
            - name: tmp
              emptyDir: {}
            restartPolicy: Never
